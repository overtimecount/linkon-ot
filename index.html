const $=s=>document.querySelector(s),ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let S=ls('s',{lang:'en',theme:'bluewhite',basic:0,att:0,atd:0,nb:0,rate:0}),D=ls('d',{}),tab='ot',cur=new Date(),user=null,db=null,auth=null;

 const ot=h*rate(),nb=n*S.nb;return{h,n,ot,nb,gross:+S.basic+ot+nb+ +S.att+ +S.atd}}

 $('#nv').innerHTML=[['ot','📅',t('ot')],['pay','🧾',t('pay')],['com','👥',t('com')],['set','⚙️',t('set')]].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';render()"><b>${a[1]}</b>${a[2]}</button>`).join('');
 $('#m').innerHTML={ot:vOT,pay:vPay,com:vCom,set:vSet}[tab]();if(tab=='com')loadPosts()}
function vOT(){const y=cur.getFullYear(),mo=cur.getMonth(),days=new Date(y,mo+1,0).getDate(),first=new Date(y,mo,1).getDay(),m=D[ym()]||{};
 let g=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="background:none"></div>'.repeat(first);
 for(let d=1;d<=days;d++){const w=new Date(y,mo,d).getDay(),v=m[d];g+=`<div class="${w==5?'fri':''} ${v?'set t-'+v:''}" onclick="pickDay(${d})">${d}<small>${v?hoursOf(v)+'h':''}</small></div>`}
 const c=calc(),fr=Object.values(m).filter(v=>v[0]=='f').length;
 return `<div class="card hero"><div class="lbl">${t('gross')}</div><div class="big">৳${Math.round(c.gross).toLocaleString()}</div><div class="chips"><span>⏱️ ${c.h}h</span><span>🌙 ${c.n}</span><span>🔥 ${fr} Fri</span></div></div>
 <div class="card"><div class="mh"><button class="btn s" onclick="mv(-1)">‹</button><b>${cur.toLocaleString(S.lang=='bn'?'bn-BD':'en',{month:'long',year:'numeric'})}</b><button class="btn s" onclick="mv(1)">›</button></div><div class="grid">${g}</div>
 <div class="legend"><span><i style="background:#ff9100"></i>3h</span><span><i style="background:#7c4dff"></i>4h</span><span><i style="background:#00bfa5"></i>6h</span><span><i style="background:#ff4081"></i>18h</span></div></div>`}
function mv(n){cur.setMonth(cur.getMonth()+n);render()}

 $('#pk').innerHTML=`<h3>${cur.getDate?'':''}${d}</h3>`+o.map(a=>`<button class="btn" onclick="setDay(${d},'${a[0]}')">${a[1]}</button>`).join('')+`<button class="btn" style="background:#8886" onclick="setDay(${d},'')">${t('off')}</button>`;$('#pick').style.display='flex'}
$('#pick').onclick=e=>{if(e.target.id=='pick')e.target.style.display='none'};

 const R=(ic,col,n,v)=>`<div class="row"><div class="ic" style="background:${col}22">${ic}</div><span class="n">${n}</span><b>${v}</b></div>`;
 return `<div class="card hero"><div class="lbl">${t('ps')} • ${ym()}</div><div class="big">${r(c.gross)}</div><div class="chips"><span>⏱️ ${c.h}h</span><span>🌙 ${c.n}</span></div></div>
 <div class="card">${R('💼','#1f4fd8',t('basic'),r(S.basic))}${R('⏱️','#ff9100',t('ot')+' ('+c.h+'h × '+rate().toFixed(2)+')',r(c.ot))}${R('🌙','#7c4dff',t('nb')+' ('+c.n+')',r(c.nb))}${R('🎯','#ff4081',t('att'),r(S.att))}${R('✅','#00bfa5',t('atd'),r(S.atd))}
 <div class="row" style="border:0"><span class="n"><b>${t('gross')}</b></span><span class="tot">${r(c.gross)}</span></div><p style="color:var(--mut);font-size:12px;text-align:center">Made with LINKON</p><button class="btn" onclick="shareSlip()">📤 ${t('share')}</button></div>`}

 <div class="card"><h3>🎨 ${t('theme')}</h3><div class="sw">${Object.entries(TH).map(([k,v])=>`<button style="background:${v[0]};${S.theme==k?'border-color:#fff;transform:scale(1.06)':''}" onclick="S.theme='${k}';apply();render()">${v[1]}</button>`).join('')}</div></div>
 <div class="card"><h3>🌐 ${t('lang')}</h3><div class="sw"><button class="btn s" onclick="S.lang='en';saveS();render()">English</button><button class="btn s" onclick="S.lang='bn';saveS();render()">বাংলা</button></div></div>

function vCom(){if(!FB.apiKey)return `<div class="card"><h3>${t('com')}</h3><p>Firebase config is empty. Paste your keys at the top of index.html (see README steps).</p></div>`;
 if(!user)return `<div class="card"><h3>${t('reg')} / ${t('login')}</h3><label>${t('name')}</label><input id="nm"><label>${t('email')}</label><input id="em" type="email"><label>${t('pw')}</label><input id="pw" type="password"><button class="btn" onclick="signup()">${t('reg')}</button><br><br><button class="btn" style="background:#8886" onclick="login()">${t('login')}</button></div>`;

function initFB(){if(!FB.apiKey||typeof firebase=='undefined')return;firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(u=>{user=u;if(u)db.collection('users').doc(u.uid).set({name:u.displayName||u.email,joined:Date.now()},{merge:true});if(tab=='com')render()})}

async function doPost(){const tx=$('#tx').value.trim(),f=$('#ph').files[0];if(!tx&&!f)return;const img=f?await shrink(f):'';
 await db.collection('posts').add({uid:user.uid,name:user.displayName||'Member',text:tx,img,t:Date.now(),likes:[]});$('#tx').value='';$('#ph').value='';loadPosts()}
let fol=[];
async function loadPosts(){const el=$('#feed');if(!el||!db)return;
